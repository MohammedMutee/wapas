[project]
name = "wapas"
version = "0.1.0"
description = "Revenue recovery agent for Razorpay merchants — detect, diagnose, recover, and prove it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "anthropic>=0.69",
    "razorpay>=1.4",
    "numpy>=2.1",
    "scipy>=1.14",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "matplotlib>=3.9",
]

[project.scripts]
wapas = "wapas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wapas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wapas/policy", "src/wapas/ledger", "src/wapas/audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running eval tests"]
