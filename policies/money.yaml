# Money policy. Governs anything that moves, promises, or gives up money.
version: "money/4"

money_actions:
  # Invariant. No configuration value may disable this; the gate hard-codes it
  # and a test asserts that a policy file attempting to set it false is rejected.
  require_valid_mandate_for_debit: true
  max_retries_per_payment: 3
  min_gap_between_retries_hours: 4
  # Populated from domain.NEVER_RETRY at load time; listed here for readability.
  never_retry_causes:
    - card_expired_or_invalid
    - risk_declined
    - mandate_revoked
    - customer_cancelled
    - invoice_disputed
    - invoice_forgotten
    - invoice_cash_crunch
    # `unknown` is deliberately ABSENT. Blocking retries for an unclassified
    # failure sounds cautious, but it reduces any non-diagnosing strategy to
    # inaction — which would have handed our agent a rigged win over the
    # industry-default baseline. A bounded retry of an already-authorised
    # payment is the least risky money action and is capped by max_retries and
    # min_gap_between_retries_hours. Caution under uncertainty restricts
    # concessions and escalation instead. See DECISIONS.md D16.
  verify_before_retry_causes:
    - technical_timeout

budgets:
  max_actions_per_episode: 8
  max_spend_per_episode_paise: 15000        # ₹150
  max_concession_pct_of_amount: 10
  approval_required_above_paise: 500000     # ₹5,000 → human in the loop
  daily_org_spend_cap_paise: 2000000        # ₹20,000

triage:
  ev_floor_paise: 500                       # ₹5 expected value to be worth acting on
  # How long any episode may be worked, for EVERY arm alike. Uniform and
  # cause-independent on purpose.
  #
  # This used to be derived per-episode from the *true* root cause, which is
  # ground truth no strategy can see. Every arm was therefore being handed a
  # cause-aware stopping rule by the harness — the agent got credit for
  # knowing when to give up, and the naive baseline had its fixed ladder
  # silently truncated by knowledge it does not have. Deciding when to stop is
  # the agent's job to earn, not the harness's to grant. See DECISIONS.md D20.
  action_window_hours: 336                  # 14 days

idempotency:
  required_on_all_actuators: true
