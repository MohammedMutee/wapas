# Channel and model rate card. Versioned so cost figures are reproducible.
# Channel rates are indicative Indian list prices; they are configuration, not
# claims, and the sensitivity sweep varies them.
version: "rates/1"
pinned_on: "2026-08-21"
fx:
  usd_inr: 87.50
  note: "Pinned. A floating rate would make the cost numbers irreproducible."

channels:
  sms:      { paise_per_unit: 12 }
  whatsapp: { paise_per_unit: 35 }
  email:    { paise_per_unit: 2 }
  voice:    { paise_per_minute: 120, assumed_minutes: 1.5 }

# USD per million tokens. Batch tiers halve these; cache reads bill at 10% of input.
#
# `notional: true` means we are NOT actually paying this. NVIDIA's developer
# tier serves these open models at no charge, which would make the cost line
# zero and the net-recovery headline meaningless. We book the published list
# rate for comparable hosted inference of a model that size instead, and the
# report labels the column as notional. Understating cost would flatter our own
# numbers — the exact failure mode the evaluation design exists to prevent.
models:
  # Open models, served free via NVIDIA NIM, priced notionally.
  openai/gpt-oss-120b:
    { input: 0.15, output: 0.60, notional: true,
      note: "Free via NVIDIA NIM. Rate is a market comparable for a ~120B MoE." }
  nvidia/nemotron-3-super-120b-a12b:
    { input: 0.15, output: 0.60, notional: true,
      note: "Free via NVIDIA NIM. Rate is a market comparable for a ~120B MoE." }
  nvidia/nemotron-3-ultra-550b-a55b:
    { input: 0.60, output: 2.40, notional: true,
      note: "Free via NVIDIA NIM. Rate is a market comparable for a ~550B MoE." }
  nvidia/nemotron-3.5-lightning-30b-a3b:
    { input: 0.04, output: 0.16, notional: true,
      note: "Free via NVIDIA NIM. Cheap tier for high-volume classification." }
  meta/llama-3.3-70b-instruct:
    { input: 0.10, output: 0.35, notional: true, note: "Free via NVIDIA NIM." }
  # Anthropic path, priced at actual list. Unused unless the provider is switched.
  claude-opus-5:              { input: 5.0,  output: 25.0 }
  claude-haiku-4-5-20251001:  { input: 1.0,  output: 5.0 }
gateway:
  retry_attempt_paise: 0      # Razorpay does not charge for a failed attempt

# ── Externalities: the cost of aggression ────────────────────────────────────
#
# Channel spend is trivially small — a few hundred rupees across a thousand
# episodes — so a ledger containing only channel spend can never show that
# guardrails pay for themselves. It makes the blast baseline look free, which
# is precisely backwards: what an over-contacting strategy actually destroys is
# the *future* revenue from a customer who opts out, complains, or disputes.
#
# These numbers are assumptions about the merchant's business, not measured
# Razorpay statistics, and they are the most contestable figures in the whole
# project. They are therefore (a) reported as a separate line, never folded
# silently into channel spend, (b) shown alongside a net figure that excludes
# them, so a reader who rejects the model can still read the report, and
# (c) swept at ±30% like every other parameter.
externalities:
  opt_out:
    # A customer who opts out is not lost as a customer. They are lost as a
    # *reachable* one: future recovery on their episodes now depends entirely
    # on self-recovery and on retries, with no contact channel available.
    horizon_months: 12
    future_episodes_per_year:
      consumer: 1.4
      business: 3.2
    recoverable_share: 0.55
    # Of the recovery we would have achieved, the share that needed a contact
    # channel. Retries survive an opt-out; payment links and reminders do not.
    contactability_loss: 0.70
    note: >
      Charged as amount × episodes_per_year × horizon × recoverable_share ×
      contactability_loss. Using this episode's amount as the proxy for the
      customer's future ticket size is a simplification; it is the best
      estimate available at the moment the opt-out happens.
  forbidden_retry:
    # Re-presenting a payment that hard-declined — a dead card, a risk decline,
    # a revoked mandate. Razorpay does not bill for a failed attempt, so this is
    # not a gateway fee; it is amortised exposure to card-network decline-rate
    # monitoring and, for e-NACH, to mandate rules.
    #
    # Deliberately modest. A figure large enough to flip the comparison against
    # the fixed-ladder baseline would be fabrication, and the report says
    # explicitly that it does not flip it. The argument against retrying a dead
    # card is a compliance argument, not a revenue one, and dressing it up as a
    # revenue one would be the weaker position.
    penalty_paise: 2000
  complaint:
    # Support handling, and the regulatory tail of a TRAI/DND complaint.
    handling_paise: 25000
  dispute:
    # Chargeback operations plus representment effort. Excludes the disputed
    # amount itself, which is already absent from recovered revenue.
    handling_paise: 60000
