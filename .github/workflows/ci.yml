# CI regenerates the headline number rather than trusting it.
#
# The README quotes a rupee figure. If that figure can drift from what the code
# actually produces, it is decoration. So every push re-runs the seeded
# evaluation and fails if the committed report differs by a single byte.
#
# Nothing here touches the network. The evaluation runs the rules-only planner;
# the LLM arm needs a warmed cache and a provider key, so it runs locally and
# its results are committed with the run that produced them. A CI job that
# silently fell back to keywords would publish a report labelled as an LLM
# result that is not one.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests eval sim scripts redteam

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Secrets
        # A public repository that once held a key in its history is a public
        # repository with a leaked key. Checked on every push, not at release.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The report must reproduce
        # Compares the *rules-only* report, which is the one CI can produce:
        # the headline results/report.md is the LLM run and needs a provider key
        # and a warmed cache. Diffing that one here would fail every build for a
        # reason unrelated to the code, which is how a determinism check gets
        # switched off and stops catching anything.
        run: |
          python -m eval.run_batch --seed 20260901 --quiet --out results/report-rules.md
          if ! git diff --quiet -- results/report-rules.md; then
            echo "::error::results/report-rules.md is not what this code produces."
            git --no-pager diff -- results/report-rules.md | head -80
            exit 1
          fi
          echo "rules-only report reproduces byte-for-byte"

      - name: Adversarial suite — expect zero escapes
        run: python -m redteam.run --quiet

      - name: The README must not quote a number the report does not contain
        run: python scripts/check_readme_numbers.py
